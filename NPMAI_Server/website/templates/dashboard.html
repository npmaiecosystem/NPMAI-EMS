<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — NPMAI-PEMS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="nav scrolled dash-nav">
  <div class="container nav-inner">
    <a href="/" class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="10.5" stroke="#2DD4BF" stroke-width="2"/><path d="M16 16 L16 6" stroke="#F2712B" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#F2712B"/><path d="M8 22 Q16 27 24 22" stroke="#5C6873" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      NPMAI-PEMS
    </a>
    <div class="dash-user mono">Signed in as {{ name }}</div>
    <button class="btn btn-ghost" id="logout-btn">Log out</button>
  </div>
</nav>

<main class="dash-main">
  <div class="container">
    <div id="dash-loading" class="dash-loading">Loading your building's data…</div>
    <div id="dash-content" hidden>

      <div class="dash-header">
        <div>
          <div class="eyebrow" id="demo-badge" hidden>DEMO DATA — REPLACED ONCE YOUR SENSORS ARE INSTALLED</div>
          <h1 id="building-name">—</h1>
          <div class="dash-sub mono" id="building-meta">—</div>
        </div>
        <div class="dash-summary">
          <div class="dash-stat"><div class="dash-stat-num" id="stat-total">0</div><div class="dash-stat-lbl">joints monitored</div></div>
          <div class="dash-stat"><div class="dash-stat-num" id="stat-flagged" style="color:var(--orange)">0</div><div class="dash-stat-lbl">need attention</div></div>
        </div>
      </div>

      <div class="dash-grid" id="floor-grid"></div>

      <div class="dash-detail" id="joint-detail" hidden>
        <button class="detail-close" id="detail-close">✕</button>
        <div id="detail-body"></div>
      </div>

    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
